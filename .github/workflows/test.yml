name: V0 validation

on:
  push:
    branches:
      - v0-prototype
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check JavaScript syntax
        run: |
          node --check app/js/app.js
          node --check app/js/calculator.js

      - name: Run calculation tests
        run: npm test

      - name: Validate JSON data files
        run: |
          python3 -m json.tool app/data/questions.json > /dev/null
          python3 -m json.tool app/data/assumptions.json > /dev/null
